name: Linux repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-and-spike:
    name: Repository checks and Linux spike build
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt
          cache: false

      - name: Check repository metadata and local documentation links
        run: python3 scripts/check_repo.py

      - name: Check Rust formatting
        run: cargo fmt --manifest-path prototypes/phase-0-native-spike/Cargo.toml --all -- --check

      - name: Run spike unit tests
        run: cargo test --locked --manifest-path prototypes/phase-0-native-spike/Cargo.toml

      - name: Run Clippy
        run: cargo clippy --locked --manifest-path prototypes/phase-0-native-spike/Cargo.toml --all-targets -- -D warnings

      - name: Build optimized Linux spike
        run: cargo build --locked --release --manifest-path prototypes/phase-0-native-spike/Cargo.toml

      - name: Install isolated headless display and software Vulkan runtimes
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libvulkan1 mesa-vulkan-drivers weston xvfb \
            libwayland-client0 libxkbcommon0 libxkbcommon-x11-0 \
            libx11-6 libxcursor1 libxi6 libxrandr2 libxcb1

      - name: Smoke-test the headless Wayland client and renderer path
        run: python3 benchmarks/capture_headless.py --backend wayland --metrics-out benchmarks/results/ci-wayland.json --capture-seconds 2 --warmup-frames 30

      - name: Smoke-test the headless X11 client and renderer path
        run: python3 benchmarks/capture_headless.py --backend x11 --metrics-out benchmarks/results/ci-x11.json --capture-seconds 2 --warmup-frames 30
